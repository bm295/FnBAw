name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FnBManagement.sln

      - name: Test with coverage
        run: dotnet test FnBManagement.sln --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: C# coverage summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('TestResults').rglob('coverage.cobertura.xml'))
          if not reports:
              raise SystemExit('No C# coverage report found')
          for report in reports:
              root = ET.parse(report).getroot()
              print(f"C# coverage ({report}): lines {float(root.attrib['line-rate']):.1%}, branches {float(root.attrib['branch-rate']):.1%}")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Angular dependencies
        working-directory: client
        run: npm ci

      - name: Angular tests with coverage
        working-directory: client
        run: npm test -- --coverage --no-watch
